name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd
  cancel-in-progress: true

jobs:
  ci-checks:
    name: CI - checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend - install
        working-directory: backend
        run: npm ci
      - name: Backend - syntax check
        working-directory: backend
        run: node --check app.js
      - name: Frontend - install
        working-directory: frontend
        run: npm ci
      - name: Frontend - build
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: CI - build & push images
    needs: ci-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image names
        id: images
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "api=ghcr.io/${repo}/blog-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repo}/blog-web" >> "$GITHUB_OUTPUT"
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.api }}:latest
            ${{ steps.images.outputs.api }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push WEB image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ steps.images.outputs.web }}:latest
            ${{ steps.images.outputs.web }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: CD - deploy to Render
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API (backend) deploy
        run: |
          curl -f -X POST \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            "${{ secrets.RENDER_HOOK_API }}"
      - name: Trigger WEB (frontend) deploy
        run: |
          curl -f -X POST \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            "${{ secrets.RENDER_HOOK_WEB }}"
      - name: Wait for backend health check
        run: |
          curl -f --retry 30 --retry-connrefused --retry-delay 10 \
            -H "Accept: application/json" \
            "${{ secrets.RENDER_API_URL }}/api/health"
